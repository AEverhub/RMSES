<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>正統小篆朱文印生成器</title>
    <!-- 開源小篆字型：現代漢字會自動套用對應的小篆字形 -->
    <style>
        @font-face {
            font-family: 'LXGWSeal';
            src: url('https://cdn.jsdelivr.net/gh/lxgw/LxgwSeal@main/TTF/LXGWSeal-Regular.ttf') format('truetype');
            font-display: block;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { background-color: #f2f2f7; color: #1c1c1e; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; }
        #termsModal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-card { background: #fff; width: 100%; max-width: 360px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
        .modal-card h3 { font-size: 1.2rem; color: #b01c1c; margin-bottom: 12px; text-align: center; }
        .modal-card p { font-size: .88rem; line-height: 1.5; color: #4a4a4a; margin-bottom: 16px; text-align: justify; }
        .modal-card .warning-list { font-size: .82rem; color: #b01c1c; margin-bottom: 20px; padding-left: 18px; }
        .modal-btn, .btn-primary, .btn-secondary { width: 100%; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .modal-btn { padding: 14px; background: #007aff; color: #fff; font-size: 1rem; }
        .app-header { text-align: center; margin-bottom: 16px; }
        .app-header h1 { font-size: 1.3rem; font-weight: 700; }
        .preview-card { background: #fff; border-radius: 16px; padding: 24px; display: flex; justify-content: center; align-items: center; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.05); background-image: linear-gradient(45deg,#e5e5e5 25%,transparent 25%),linear-gradient(-45deg,#e5e5e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e5e5 75%),linear-gradient(-45deg,transparent 75%,#e5e5e5 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; min-height: 280px; }
        .seal-box { width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
        .control-card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
        .form-group label { display: block; font-size: .85rem; font-weight: 600; color: #6e6e73; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid #c6c6c8; border-radius: 10px; background: #f9f9f9; outline: none; }
        .form-control:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,.12); }
        .conversion-status { margin-top: 8px; min-height: 1.2em; color: #6e6e73; font-size: .78rem; }
        .action-group { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .btn-primary { padding: 14px; background: #007aff; color: #fff; font-size: 1rem; }
        .btn-secondary { padding: 12px; background: #e5e5ea; color: #1c1c1e; font-size: .95rem; }
    </style>
</head>
<body>
    <div id="termsModal">
        <div class="modal-card">
            <h3>⚠️ 使用條款與聲明</h3>
            <p>歡迎使用印章生成器！本工具僅供設計測試、繪畫輔助與個人藝術創作使用。</p>
            <ul class="warning-list"><li>本工具會將您設定的印章內容儲存於手機本地。</li><li>嚴禁用於偽造公私印章、公文書、合約或任何詐欺違法行為。</li><li>使用者須自行承擔任何因不當使用所衍生之法律責任。</li></ul>
            <button class="modal-btn" id="agreeBtn">同意並開始使用</button>
        </div>
    </div>

    <div class="app-header"><h1>正統朱文印（滿版直排）</h1></div>
    <div class="preview-card"><div class="seal-box" id="sealContainer"></div></div>
    <div class="control-card">
        <div class="form-group">
            <label for="sealText">輸入文字（右上開始向下直排塞滿）</label>
            <input type="text" id="sealText" class="form-control" value="吉祥如意" placeholder="請輸入 1~12 個字" maxlength="12">
            <div class="conversion-status" id="conversionStatus" aria-live="polite"></div>
        </div>
    </div>
    <div class="action-group">
        <button class="btn-primary" id="downloadBtn">⬇️ 下載透明背景 PNG</button>
        <button class="btn-secondary" id="resetBtn">🔄 恢復預設值</button>
    </div>

    <script>
        const DEFAULT_TEXT = "吉祥如意";
        document.getElementById('agreeBtn').addEventListener('click', () => {
            document.getElementById('termsModal').style.display = 'none';
        });

        function loadSavedText() { return localStorage.getItem('zhuan_seal_text') || DEFAULT_TEXT; }
        function saveText(text) { localStorage.setItem('zhuan_seal_text', text); }
        function escapeXml(value) {
            return value.replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&apos;', '"':'&quot;' }[ch]));
        }

        function buildFullSealSVG(text) {
            const rawChars = Array.from(text.trim() || "印").slice(0, 12);
            const count = rawChars.length;
            let rows = count === 1 ? 1 : count <= 4 ? 2 : count <= 9 ? 3 : 4;
            const cols = Math.ceil(count / rows);
            const innerSize = 220, innerX = 40, innerY = 40;
            const cellW = innerSize / cols, cellH = innerSize / rows;
            const fontSize = Math.min(cellW, cellH) * 0.98;
            let textSvg = '';

            rawChars.forEach((c, i) => {
                const row = i % rows;
                const col = (cols - 1) - Math.floor(i / rows);
                const x = innerX + col * cellW + cellW / 2;
                const y = innerY + row * cellH + cellH / 2 + fontSize * .05;
                textSvg += `<text x="${x}" y="${y}" font-size="${fontSize}" font-family="LXGWSeal, serif" font-weight="400" fill="#b01c1c" text-anchor="middle" dominant-baseline="middle" transform="scale(.8,1.25)" transform-origin="${x} ${y}">${escapeXml(c)}</text>`;
            });

            return `<svg id="sealSvg" viewBox="0 0 300 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="300" height="300" rx="2" fill="#b01c1c"/>
                <rect x="40" y="40" width="220" height="220" fill="#fff"/>
                ${textSvg}
            </svg>`;
        }

        function renderSeal() {
            const textInput = document.getElementById('sealText');
            const text = textInput.value;
            document.getElementById('sealContainer').innerHTML = buildFullSealSVG(text);
            document.getElementById('conversionStatus').textContent = text.trim() ? '已自動套用小篆字形並排入印面' : '請輸入文字';
            saveText(text);
        }

        const sealInput = document.getElementById('sealText');
        sealInput.value = loadSavedText();
        sealInput.addEventListener('input', renderSeal);
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('確定要恢復預設文字嗎？')) { sealInput.value = DEFAULT_TEXT; renderSeal(); }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const svgEl = document.getElementById('sealSvg');
            if (!svgEl) return;
            const svgData = new XMLSerializer().serializeToString(svgEl);
            const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'), img = new Image();
            canvas.width = 600; canvas.height = 600;
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const a = document.createElement('a'); a.download = 'seal_zhuan.png'; a.href = canvas.toDataURL('image/png'); a.click();
                URL.revokeObjectURL(url);
            };
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
        });
        renderSeal();
    </script>
</body>
</html>
