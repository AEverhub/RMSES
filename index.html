<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電競平台 V5.0.1 - 登入專區</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e1e1e; border: 1px solid #2c2c2c; border-radius: 12px; width: 100%; max-width: 400px; padding: 30px 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); text-align: center; }
        
        /* 商標樣式 */
        .logo { width: 100px; height: auto; margin-bottom: 15px; }
        
        h2 { font-size: 1.4rem; color: #ffffff; margin-bottom: 8px; }
        .subtitle { font-size: 0.95rem; color: #b388ff; margin-bottom: 24px; }
        .tip { font-size: 0.85rem; color: #9e9e9e; margin-bottom: 16px; }

        .social-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; margin-bottom: 12px; border: none; transition: opacity 0.2s; }
        .google-btn { background-color: #ffffff; color: #000000; }
        .apple-btn { background-color: #000000; color: #ffffff; border: 1px solid #333; }
        
        .divider { display: flex; align-items: center; color: #666; font-size: 0.85rem; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #333; }
        .divider::before { margin-right: 10px; } .divider::after { margin-left: 10px; }

        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group input { width: 100%; padding: 12px 14px; background-color: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 8px; color: #ffffff; }
        
        .action-btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: 500; cursor: pointer; border: none; color: #ffffff; margin-top: 6px; }
        .login-submit-btn { background-color: #2962ff; }
        .register-submit-btn { background-color: #00c853; }

        .switch-mode { margin-top: 18px; font-size: 0.85rem; color: #b388ff; cursor: pointer; background: none; border: none; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 這裡放入你的商標 -->
        <img src="7236-removebg-preview.png" alt="Logo" class="logo">
        
        <h2>電競平台 V5.0.1</h2>
        <div class="subtitle">【常規用戶（老闆）專區】</div>
        
        <div id="auth-form-container">
            <div class="tip" id="form-tip">請選擇登入方式以開始測驗</div>

            <button class="social-btn google-btn" id="google-login-btn">
                使用 Google 帳號登入
            </button>

            <button class="social-btn apple-btn">
                使用 Apple 帳號登入
            </button>

            <div class="divider">或使用站內 ID</div>

            <div id="login-section">
                <div class="input-group"><input type="text" placeholder="UID"></div>
                <div class="input-group"><input type="password" placeholder="Password"></div>
                <button class="action-btn login-submit-btn">登入</button>
                <button class="switch-mode" onclick="toggleMode('register')">沒有帳號？切換為註冊模式</button>
            </div>

            <div id="register-section" class="hidden">
                <div class="input-group"><input type="text" placeholder="UID"></div>
                <div class="input-group"><input type="password" placeholder="Password"></div>
                <button class="action-btn register-submit-btn">註冊</button>
                <button class="switch-mode" onclick="toggleMode('login')">已有帳號？切換為登入模式</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBq9ogxyp03N-kqGreK5s3ua7-Cozhn5kY",
            authDomain: "rms-srn.firebaseapp.com",
            projectId: "rms-srn",
            storageBucket: "rms-srn.firebasestorage.app",
            messagingSenderId: "12210643612",
            appId: "1:12210643612:web:7339c5785b886ac02d4359",
            measurementId: "G-1SYC3WZSNX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Google 登入邏輯
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                alert("登入成功：" + result.user.displayName);
            } catch (error) {
                alert("登入失敗: " + error.message);
            }
        });

        // 頁面切換邏輯
        window.toggleMode = function(mode) {
            const loginSec = document.getElementById('login-section');
            const regSec = document.getElementById('register-section');
            const tip = document.getElementById('form-tip');
            if (mode === 'register') {
                loginSec.classList.add('hidden');
                regSec.classList.remove('hidden');
                tip.textContent = '填寫下方資料即可快速註冊';
            } else {
                regSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
                tip.textContent = '請選擇登入方式以開始測驗';
            }
        }
    </script>
</body>
</html>
