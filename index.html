(){localStorage.setItem('donggang-web-state',JSON.stringify(state))}function toggleMenu(){document.querySelector('#menu').classList.toggle('show')}function go(p){page=p;toggleMenu();render()}function parts(e){let a=e.split('<br>');return{course:a[0]||'-',teacher:a[1]||'-'}}function table(name){let info=scheduleData[name];let h='<div class="card"><h3>'+name+' 完整週課表</h3><div class="tableWrap"><table class="schedule"><tr><th>節次</th>'+days.map(x=>'<th>週'+x+'</th>').join('')+'</tr>';for(let p=1;p<=7;p++){h+='<tr><th>第'+p+'節<br>'+slots[p-1][0]+'</th>';for(let d=0;d<5;d++){let x=parts(info.schedule[p][d]);h+='<td><div class="course">'+x.course+'</div><div class="teacher">'+x.teacher+'</div></td>'}h+='</tr>'}return h+'</table></div></div>'}function current(){let now=new Date(),d=now.getDay(),t=now.toTimeString().slice(0,5);if(d<1||d>5)return null;let p=slots.findIndex(x=>t>=x[0]&&t<=x[1]);if(p<0)return null;let key=new Date().toISOString().slice(0,10)+'-'+(p+1);return{p:p+1,d,key,...parts(state.changes[key]||scheduleData[state.currentClass].schedule[p+1][d-1])}}function home(){let now=new Date(),c=current(), students=state.students;let duty=students.length?students[Math.floor(now.getDate()/state.dutyCount)%students.length]:null;let group=state.mealGroups.length?state.mealGroups[Math.floor(now.getDate())%state.mealGroups.length]:'尚未設定';return '<div class="title">首頁</div><div class="muted">'+state.currentClass+'｜導師：'+scheduleData[state.currentClass].mentor+'</div><div class="card"><h3>世界標準時鐘（UTC）</h3><div class="clock">'+now.toISOString().slice(11,19)+'</div><div class="muted">台灣時間 '+now.toLocaleTimeString('zh-TW',{hour12:false})+'</div><hr><div class="label">目前課程</div><div class="value">'+(c?c.course:'目前非上課時間')+'</div><div class="muted">'+(c?'週'+days[c.d-1]+'｜第'+c.p+'節 '+slots[c.p-1].join('–'):'-')+'</div><div class="label">授課教師</div><div class="value">'+(c?c.teacher:'-')+'</div><div class="label">上課地點</div><div class="value">上課地點不定</div></div><div class="grid"><div class="card"><h3>值日生</h3><div class="value">'+(duty?duty.seat+'號 '+duty.name:'尚未設定')+'</div><div class="muted">自動輪迴｜每次 '+state.dutyCount+' 人</div></div><div class="card"><h3>抬餐桶輪班</h3><div class="value">'+group+'</div><div class="muted">自動輪迴</div></div></div>'+table(state.currentClass)}function classPage(){return '<div class="title">班級設定</div><div class="card"><h3>首頁顯示班級</h3><div class="chips">'+classes.map(c=>'<button class="chip '+(c===state.currentClass?'active':'')+'" onclick="state.currentClass=\''+c+'\';save();render()">'+c+'</button>').join('')+'</div></div><div class="card"><h3>新增學生</h3><div class="row"><input id="sn" placeholder="姓名"><input id="sid" placeholder="學號"><input id="ss" placeholder="坐號" type="number"><button class="button" onclick="addStudent()">新增</button></div><p class="muted">值日輪值人數：<button class="chip" onclick="state.dutyCount=state.dutyCount%3+1;save();render()">'+state.dutyCount+' 人</button></p><h3>學生名單</h3>'+(state.students.length?state.students.map((s,i)=>'<div class="row"><span>'+s.seat+'號｜'+s.name+'｜'+s.id+'</span><span class="danger" onclick="state.students.splice('+i+',1);save();render()">刪除</span></div>').join(''):'<span class="muted">尚未新增學生</span>')+'</div>'}function teacherPicker(kind){return '<div class="dropdown"><input id="tq" placeholder="輸入教師姓名逐字搜尋" oninput="filterTeachers(\''+kind+'\')"><div id="opts" class="options hidden"></div></div>'}function filterTeachers(kind){let q=document.querySelector('#tq').value;let o=document.querySelector('#opts');o.innerHTML=teachers.filter(t=>t.includes(q)).map(t=>'<div onclick="selectTeacher(\''+t+'\',\''+kind+'\')">'+t+'</div>').join('');o.classList.remove('hidden')}function selectTeacher(t,kind){document.querySelector('#tq').value=t;document.querySelector('#opts').classList.add('hidden');if(kind==='survey')document.querySelector('#surveyResult').innerHTML=survey(t);else document.querySelector('#teacherResult').innerHTML=teacherResult(t)}function teacherResult(t){let r=[];for(const n of classes)for(const [p,d] of Object.entries(scheduleData[n].schedule))d.forEach((e,i)=>{let x=parts(e);if(x.teacher.includes(t))r.push('<div>'+n+'｜週'+days[i]+' 第'+p+'節｜'+x.course+'</div>')});return '<div class="card"><h3>'+t+' 授課動態</h3>'+r.join('')+'</div>'}function survey(t){let r=teacherResult(t).replace('授課動態','教師調查');return r.replaceAll('</div>','<div class="muted">上課地點：上課地點不定</div></div>')}function teacherPage(kind){return '<div class="title">'+(kind==='survey'?'教師調查':'查找教師動態')+'</div><div class="card"><p class="muted">下拉選單一定有教師，輸入文字會逐字排除不符合的人選。</p>'+teacherPicker(kind)+'<div id="'+(kind==='survey'?'surveyResult':'teacherResult')+'" class="card"><span class="muted">請選擇教師</span></div></div>'}function lookup(){return '<div class="title">查找班級課表</div><div class="chips">'+classes.map(c=>'<button class="chip" onclick="document.querySelector(\'#lookup\').innerHTML=table(\''+c+'\')">'+c+'</button>').join('')+'</div><div id="lookup">'+table(state.currentClass)+'</div>'}function changePage(){return '<div class="title">調課／代課設定</div><div class="card"><input id="cd" placeholder="日期 YYYY-MM-DD"><input id="cp" placeholder="節次 1-7" type="number"><input id="cc" placeholder="完整課程名稱"><input id="ct" placeholder="代課教師（可留白）"><button class="button" onclick="let k=cd.value+'-'+cp.value;state.changes[k]=cc.value+'<br>'+(ct.value||'-');save();alert('已儲存');">儲存調課／代課</button></div>'}function absence(){return '<div class="title">未到登記</div><div class="card"><input id="ad" placeholder="日期 YYYY-MM-DD"><input id="ap" placeholder="節次 1-7" type="number"><input id="as" placeholder="學生坐號" type="number"><select id="ar"><option>公假</option><option>事假</option><option>喪假</option><option>病假</option><option>曠課</option></select><button class="button" onclick="state.absences[ad.value+'-'+ap.value+'-'+as.value]=ar.value;save();alert('已登記');">儲存未到登記</button></div>'}function render(){let labels=['首頁','班級設定','查找教師動態','教師調查','查找班級課表','調課／代課設定','未到登記'],pages=['home','class','teacher','survey','lookup','change','absence'];document.querySelector('#menu').innerHTML=labels.map((x,i)=>'<button onclick="go(\''+pages[i]+'\')">'+(i+1)+'. '+x+'</button>').join('');let content=page==='home'?home():page==='class'?classPage():page==='teacher'?teacherPage('teacher'):page==='survey'?teacherPage('survey'):page==='lookup'?lookup():page==='change'?changePage():absence();document.querySelector('#app').innerHTML=content}function addStudent(){let n=document.querySelector('#sn').value,id=document.querySelector('#sid').value,s=Number(document.querySelector('#ss').value);if(n&&id&&s){state.students.push({name:n,id,seat:s});save();render()}else alert('請填妥姓名、學號、坐號')}render();setInterval(()=>{if(page==='home')render()},1000)</script></body></html>
