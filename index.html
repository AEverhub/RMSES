<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電競平台 V5.0.1</title>
    <style>
        /* 樣式保持簡潔，修正身份選單布局 */
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e1e1e; border: 1px solid #2c2c2c; border-radius: 12px; width: 100%; max-width: 400px; padding: 30px 20px; text-align: center; }
        .logo { width: 120px; margin-bottom: 15px; }
        
        /* 身份選擇下拉選單 */
        select { width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; margin-bottom: 20px; }
        
        .social-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: none; cursor: pointer; }
        .google-btn { background: #fff; color: #000; }
        .apple-btn { background: #000; color: #fff; border: 1px solid #555; }
        .input-group input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 8px; color: #fff; margin-bottom: 10px; }
        .login-btn { width: 100%; padding: 12px; background: #2962ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <img src="7236-removebg-preview.png" alt="Logo" class="logo">
        <h2>電競平台 V5.0.1</h2>

        <!-- 補回身份選單 -->
        <select id="user-role">
            <option value="owner">常規用戶（老闆）</option>
            <option value="member">一般會員</option>
            <option value="admin">管理員</option>
        </select>

        <button class="social-btn google-btn" id="google-login">使用 Google 帳號登入</button>
        <button class="social-btn apple-btn" id="apple-login">使用 Apple 帳號登入</button>

        <div style="margin: 20px 0; color: #666;">或使用站內 ID</div>

        <div class="input-group">
            <input type="text" id="uid" placeholder="UID">
            <input type="password" id="password" placeholder="Password">
            <button class="login-btn" onclick="handleLogin()">登入</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBq9ogxyp03N-kqGreK5s3ua7-Cozhn5kY",
            authDomain: "rms-srn.firebaseapp.com",
            projectId: "rms-srn",
            storageBucket: "rms-srn.firebasestorage.app",
            messagingSenderId: "12210643612",
            appId: "1:12210643612:web:7339c5785b886ac02d4359"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Google 登入監聽
        document.getElementById('google-login').onclick = async () => {
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                alert("登入成功: " + result.user.email);
            } catch (e) {
                // 如果登入失敗，這個 alert 會告訴你原因
                alert("登入失敗，請確認 Firebase 設定是否已啟用 Google 登入，且網域已加入授權清單。錯誤代碼: " + e.message);
                console.error(e);
            }
        };

        window.handleLogin = () => {
            const role = document.getElementById('user-role').value;
            const uid = document.getElementById('uid').value;
            alert(`以 ${role} 身份登入中... UID: ${uid}`);
        };
    </script>
</body>
</html>
