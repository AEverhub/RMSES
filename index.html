<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電競平台 V5.0.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1e1e1e; border: 1px solid #2c2c2c; border-radius: 12px; width: 100%; max-width: 400px; padding: 30px 20px; text-align: center; }
        .logo { width: 120px; margin-bottom: 15px; }
        
        select { width: 100%; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; margin-bottom: 20px; font-size: 1rem; }
        
        .social-login-group { transition: all 0.3s ease; }
        .social-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: none; cursor: pointer; font-size: 0.95rem; }
        .social-icon { width: 20px; height: 20px; margin-right: 10px; }
        .google-btn { background: #fff; color: #000; }
        .apple-btn { background: #000; color: #fff; border: 1px solid #555; }
        
        .divider { color: #666; font-size: 0.85rem; margin: 15px 0; }
        
        .input-group input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 8px; color: #fff; margin-bottom: 12px; }
        .login-btn { width: 100%; padding: 12px; background: #2962ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .hidden { display: none !important; }
        .notice { font-size: 0.85rem; color: #b388ff; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <img src="7236-removebg-preview.png" alt="Logo" class="logo">
        <h2>電競平台 V5.0.1</h2>

        <!-- 身份選單 -->
        <select id="user-role" onchange="handleRoleChange()">
            <option value="user">普通用戶</option>
            <option value="club">俱樂部成員</option>
            <option value="cs">客服人員</option>
            <option value="admin">管理員</option>
        </select>

        <!-- 提示訊息 -->
        <div id="role-notice" class="notice hidden">此身份需使用站內 ID 進行驗證登入</div>

        <!-- 社交登入群組（僅普通用戶可見） -->
        <div id="social-group" class="social-login-group">
            <button class="social-btn google-btn" id="google-login">
                <span class="social-icon"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.13 0 9.87 0 12s.43 3.87 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg></span>
                使用 Google 帳號登入
            </button>

            <button class="social-btn apple-btn" id="apple-login">
                <span class="social-icon"><svg viewBox="0 0 24 24" fill="#ffffff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.83 6.07c.57-.69 1.05-1.65.93-2.61-.92.04-2.03.62-2.68 1.35-.55.63-1.03 1.62-.89 2.57 1.03.08 2.07-.51 2.64-1.31z"/></svg></span>
                使用 Apple 帳號登入
            </button>

            <div class="divider" id="divider-text">或使用站內 ID</div>
        </div>

        <!-- 站內 ID 登入 -->
        <div class="input-group">
            <input type="text" id="uid" placeholder="UID">
            <input type="password" id="password" placeholder="Password">
            <button class="login-btn" onclick="handleLogin()">登入</button>
        </div>
    </div>

    <script>
        // 切換身份時的動態效果（隱藏/顯示社交登入）
        function handleRoleChange() {
            const role = document.getElementById('user-role').value;
            const socialGroup = document.getElementById('social-group');
            const roleNotice = document.getElementById('role-notice');

            if (role === 'user') {
                socialGroup.classList.remove('hidden');
                roleNotice.classList.add('hidden');
            } else {
                socialGroup.classList.add('hidden');
                roleNotice.classList.remove('hidden');
            }
        }

        window.handleLogin = () => {
            const role = document.getElementById('user-role').value;
            const uid = document.getElementById('uid').value;
            alert(`正在以 [${role}] 身份透過站內 ID 進行驗證登入...\nUID: ${uid}`);
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBq9ogxyp03N-kqGreK5s3ua7-Cozhn5kY",
            authDomain: "rms-srn.firebaseapp.com",
            projectId: "rms-srn",
            storageBucket: "rms-srn.firebasestorage.app",
            messagingSenderId: "12210643612",
            appId: "1:12210643612:web:7339c5785b886ac02d4359"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('google-login').onclick = async () => {
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                alert("普通用戶 Google 登入成功！");
            } catch (e) {
                alert("登入失敗: " + e.message + "\n\n檢查提醒：\n1. 請確認 Firebase 專案 Authentication 是否已啟用 Google。\n2. 授權網域 (Authorized Domains) 是否已加入 aeverhub.github.io。");
            }
        };
    </script>
</body>
</html>
