<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電競平台 V5.0.1 - 專區</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            border: 1px solid #2c2c2c;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #b388ff;
            margin-bottom: 24px;
        }

        .tip {
            font-size: 0.85rem;
            color: #9e9e9e;
            margin-bottom: 16px;
        }

        /* 第三方登入按鈕 */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
            border: none;
            transition: opacity 0.2s;
        }

        .social-btn:hover {
            opacity: 0.9;
        }

        .google-btn {
            background-color: #ffffff;
            color: #000000;
        }

        .apple-btn {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #333;
        }

        .social-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon svg {
            width: 100%;
            height: 100%;
        }

        /* 分隔線 */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }

        .divider::before {
            margin-right: 10px;
        }

        .divider::after {
            margin-left: 10px;
        }

        /* 輸入框 */
        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #b388ff;
        }

        .input-group input::placeholder {
            color: #757575;
        }

        /* 操作按鈕 */
        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            color: #ffffff;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .login-submit-btn {
            background-color: #2962ff;
        }

        .register-submit-btn {
            background-color: #00c853;
        }

        /* 切換模式與返回 */
        .switch-mode {
            margin-top: 18px;
            font-size: 0.85rem;
            color: #b388ff;
            cursor: pointer;
            background: none;
            border: none;
            text-decoration: underline;
        }

        .back-btn {
            width: 100%;
            max-width: 400px;
            background-color: #2a2a2a;
            color: #b0b0b0;
            border: 1px solid #3d3d3d;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #333333;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>電競平台 V5.0.1</h2>
        <div class="subtitle">【常規用戶（老闆）專區】</div>
        
        <div id="auth-form-container">
            <div class="tip" id="form-tip">請選擇登入方式以開始測驗</div>

            <!-- 第三方登入 -->
            <button class="social-btn google-btn">
                <span class="social-icon">
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.13 0 9.87 0 12s.43 3.87 1.18 5.4l4.09-3.16z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                </span>
                使用 Google 帳號登入
            </button>

            <button class="social-btn apple-btn">
                <span class="social-icon">
                    <svg viewBox="0 0 24 24" fill="#ffffff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.83 6.07c.57-.69 1.05-1.65.93-2.61-.92.04-2.03.62-2.68 1.35-.55.63-1.03 1.62-.89 2.57 1.03.08 2.07-.51 2.64-1.31z"/></svg>
                </span>
                使用 Apple 帳號登入
            </button>

            <div class="divider">或使用站內 ID</div>

            <!-- 登入表單 (預設顯示) -->
            <div id="login-section">
                <div class="input-group">
                    <input type="text" placeholder="Admin (請輸入帳號)">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="•••••••• (請輸入密碼)">
                </div>
                <button class="action-btn login-submit-btn">登入</button>
                <button class="switch-mode" onclick="toggleMode('register')">沒有帳號？切換為註冊模式</button>
            </div>

            <!-- 註冊表單 (預設隱藏，無驗證碼欄位) -->
            <div id="register-section" class="hidden">
                <div class="input-group">
                    <input type="text" placeholder="請設定新帳號 ID">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="請設定密碼">
                </div>
                <button class="action-btn register-submit-btn">註冊</button>
                <button class="switch-mode" onclick="toggleMode('login')">已有帳號？切換為登入模式</button>
            </div>

        </div>
    </div>

    <button class="back-btn">返回上一佈</button>

    <script>
        function toggleMode(mode) {
            const loginSec = document.getElementById('login-section');
            const regSec = document.getElementById('register-section');
            const tip = document.getElementById('form-tip');

            if (mode === 'register') {
                loginSec.classList.add('hidden');
                regSec.classList.remove('hidden');
                tip.textContent = '填寫下方資料即可快速註冊';
            } else {
                regSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
                tip.textContent = '請選擇登入方式以開始測驗';
            }
        }
    </script>
</body>
</html>
